name: Build Android APK

# Builds a signed Android APK on every push to main, on every tag (v*),
# and on demand via the "Run workflow" button. The signed APK is uploaded
# as a workflow artifact, and tag pushes additionally create a GitHub
# Release with the APK attached so users can download it directly from
# the repo's Releases page.
#
# REQUIRED REPO SECRETS (Settings → Secrets and variables → Actions):
#
#   ANDROID_KEYSTORE_BASE64   base64-encoded contents of your *.keystore
#                             file. Generate locally with:
#                               keytool -genkey -v -keystore scootflash.keystore \
#                                 -alias scootflash -keyalg RSA -keysize 2048 \
#                                 -validity 10000
#                             then:
#                               base64 -w0 scootflash.keystore | pbcopy   (macOS)
#                               base64 -w0 scootflash.keystore            (linux)
#
#   ANDROID_KEYSTORE_PASSWORD    keystore password (the first one keytool asks for)
#   ANDROID_KEY_ALIAS            alias you used above (e.g. "scootflash")
#   ANDROID_KEY_PASSWORD         alias key password
#
# If any of the secrets are missing the job falls back to an UNSIGNED
# debug APK so first-time users still get a downloadable file.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # needed to create releases on tag pushes

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Add Android platform (idempotent)
        run: |
          if [ ! -d "android" ] || [ ! -f "android/gradlew" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor → Android
        run: npx cap sync android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Decode signing keystore
        id: keystore
        if: ${{ env.HAVE_SIGNING == 'true' }}
        env:
          HAVE_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/signing/release.keystore"
          echo "path=$RUNNER_TEMP/signing/release.keystore" >> "$GITHUB_OUTPUT"

      - name: Inject release signing config
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          GRADLE_FILE="android/app/build.gradle"
          if grep -q "signingConfigs.release" "$GRADLE_FILE"; then
            echo "signingConfigs.release already present — skipping injection"
            exit 0
          fi
          # Insert a signingConfigs block + wire it into buildTypes.release.
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("android/app/build.gradle")
          src = p.read_text()
          signing_block = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """
          # Insert just inside the android { ... } block.
          src = re.sub(r"(android\s*\{)", r"\1" + signing_block, src, count=1)
          # Add signingConfig to buildTypes.release if a release block exists, else create one.
          if re.search(r"buildTypes\s*\{[^}]*release\s*\{", src, re.S):
              src = re.sub(
                  r"(buildTypes\s*\{[^}]*release\s*\{)",
                  r"\1\n            signingConfig signingConfigs.release",
                  src, count=1, flags=re.S,
              )
          else:
              src = re.sub(
                  r"(buildTypes\s*\{)",
                  r"""\1
              release {
                  signingConfig signingConfigs.release
                  minifyEnabled false
              }""",
                  src, count=1,
              )
          p.write_text(src)
          PY
          echo "--- patched build.gradle ---"
          cat "$GRADLE_FILE"

      - name: Build release APK + AAB (signed)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Build debug APK (fallback — no signing secrets configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        run: |
          echo "::warning ::ANDROID_KEYSTORE_BASE64 not set — producing an UNSIGNED debug APK (no AAB; Play Store requires a signed bundle). See workflow file for setup."
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n1)
          if [ -z "$APK" ]; then
            echo "::error ::No APK produced"
            exit 1
          fi
          DEST="scootflash-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          cp "$APK" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: Locate AAB (signed builds only)
        id: aab
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          AAB=$(find android/app/build/outputs/bundle -name "*.aab" | head -n1)
          if [ -z "$AAB" ]; then
            echo "::error ::No AAB produced"
            exit 1
          fi
          DEST="scootflash-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.aab"
          cp "$AAB" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: Generate SHA256 checksums
        id: checksum
        run: |
          APK="${{ steps.apk.outputs.path }}"
          APK_SUM="${APK}.sha256"
          sha256sum "$APK" > "$APK_SUM"
          cat "$APK_SUM"
          echo "apk_sum=$APK_SUM" >> "$GITHUB_OUTPUT"

          AAB="${{ steps.aab.outputs.path }}"
          if [ -n "$AAB" ] && [ -f "$AAB" ]; then
            AAB_SUM="${AAB}.sha256"
            sha256sum "$AAB" > "$AAB_SUM"
            cat "$AAB_SUM"
            echo "aab_sum=$AAB_SUM" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK + AAB as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: scootflash-android
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.checksum.outputs.apk_sum }}
            ${{ steps.aab.outputs.path }}
            ${{ steps.checksum.outputs.aab_sum }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.checksum.outputs.apk_sum }}
            ${{ steps.aab.outputs.path }}
            ${{ steps.checksum.outputs.aab_sum }}
          generate_release_notes: true


